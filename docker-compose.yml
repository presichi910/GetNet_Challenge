# One model per role. Values come from the shell or .env; these defaults are the configuration that is evaluated
# (agents and judge on OpenRouter, each model pinned to one host; the 2026-11-15 reports were made on Fireworks + Groq).
# Override for a single run: KNOWLEDGE_MODEL=anthropic/claude-haiku-5.5 docker compose run --rm eval
x-models: &models
  AGENT_PROVIDER: ${AGENT_PROVIDER:-openrouter}      # openrouter, groq or fireworks (agents only)
  JUDGE_PROVIDER: ${JUDGE_PROVIDER:-openrouter}      # openrouter or groq (the eval judge)
  LLM_MODEL: ${LLM_MODEL:-openai/gpt-oss-120b}      # knowledge agent
  LIGHT_MODEL: ${LIGHT_MODEL:-openai/gpt-oss-120b}  # router, synthesizer, verifier (and support if SUPPORT_MODEL is empty)
  SUPPORT_MODEL: ${SUPPORT_MODEL:-openai/gpt-oss-120b}  # support agent
  KNOWLEDGE_MODEL: ${KNOWLEDGE_MODEL:-}   # empty = LLM_MODEL (the model comparison sets it)
  SYNTH_MODEL: ${SYNTH_MODEL:-}           # empty = LIGHT_MODEL
  JUDGE_MODEL: ${JUDGE_MODEL:-qwen/qwen3.8-27b}     # eval judge (different family than the agents)
  REASONING_EFFORT: ${REASONING_EFFORT:-low}

# Who may call the API. Two issuers (Keycloak realms), each with its own audience and signing keys: merchants for
# /chat and /conversations, operators for /operator/*. The ISSUER is what the token says (the address a client used to
# reach Keycloak, localhost:8180 from the host); the JWKS URL is where THIS container fetches the public keys.
x-auth: &auth
  JWKS_URL: ${JWKS_URL:-http://keycloak:8080/realms/getnet-merchants/protocol/openid-connect/certs}
  JWT_ISSUER: ${JWT_ISSUER:-http://localhost:8180/realms/getnet-merchants}
  JWT_AUDIENCE: ${JWT_AUDIENCE:-getnet-support-api}
  OPERATOR_JWKS_URL: ${OPERATOR_JWKS_URL:-http://keycloak:8080/realms/getnet-operators/protocol/openid-connect/certs}
  OPERATOR_JWT_ISSUER: ${OPERATOR_JWT_ISSUER:-http://localhost:8180/realms/getnet-operators}
  OPERATOR_JWT_AUDIENCE: ${OPERATOR_JWT_AUDIENCE:-getnet-operator-api}

services:
  # Identity provider for the demo (dev mode, in-memory database, realms imported from infra/keycloak). It is bound to
  # 127.0.0.1 only. A real deployment uses the company's own identity provider: only the six AUTH variables change.
  keycloak:
    image: quay.io/keycloak/keycloak:26.2@sha256:4883630ef9db14031cde3e60700c9a9a8eaf1b5c24db1589d6a2d43de38ba2a9
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD in .env (any long random value)}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:?set DEMO_USER_PASSWORD in .env (the password of the demo users)}
      KC_HOSTNAME: http://localhost:8180            # the issuer clients see...
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"       # ...while the API reaches it as keycloak:8080
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:8180:8080"   # 8080 is often taken on a developer machine
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      # the image has no curl: ask the management port with bash
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s
    restart: unless-stopped

  api:
    build: .
    image: getnet-agents:latest
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      <<: [*models, *auth]
      WEB_CONCURRENCY: "1"   # one worker only (rate limit and key cache in the process, conversations in one SQLite file)
      # if the primary provider has an outage (5xx, 429, timeout) the same model on Fireworks answers instead (needs FIREWORKS_API_KEY); "" = no failover.
      # Not Groq: the agents' host on OpenRouter is Groq, so it would not be independent of the primary
      FALLBACK_PROVIDER: ${FALLBACK_PROVIDER-fireworks}
    depends_on:
      keycloak:
        condition: service_healthy
    volumes:
      - data:/app/data   # named volume: Chroma, tickets, handoffs survive restarts (see README, Production hardening)
    restart: unless-stopped

  # one-off jobs (not started by `up`):
  #   docker compose run --rm ingest   -> build the knowledge base
  #   docker compose run --rm eval     -> run the evaluation
  ingest:
    image: getnet-agents:latest
    profiles: ["tools"]
    env_file: .env
    volumes:
      - data:/app/data
    command: ["python", "-m", "app.rag.ingest"]

  eval:
    image: getnet-agents:latest
    profiles: ["tools"]
    env_file: .env
    environment:
      <<: *models
      FALLBACK_PROVIDER: ""   # a measurement runs on ONE provider: no silent switch to another model in the middle of a report
    volumes:
      - data:/app/data
      - ./eval/reports:/app/eval/reports
    command: ["python", "-m", "eval.run_eval"]

  # ---- observability (docker compose --profile observability up): traces in Jaeger, metrics in Prometheus, a dashboard in Grafana ----
  # Everything binds to 127.0.0.1. To use it set in .env: OTLP_ENDPOINT=http://jaeger:4317 and METRICS_TOKEN=<value>, and put the SAME value in the file
  # infra/observability/metrics_token (not in git): Prometheus sends it as a bearer. The API runs without any of this.
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    profiles: ["observability"]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "127.0.0.1:16686:16686"   # the UI
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.0.1
    profiles: ["observability"]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=15d"]
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./infra/observability/metrics_token:/etc/prometheus/metrics_token:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on: [api]
    restart: unless-stopped

  grafana:
    image: grafana/grafana-oss:10.1.2
    profiles: ["observability"]
    # no weak default: Grafana refuses to start without GRAFANA_ADMIN_PASSWORD (checked here, not with `:?`, which Compose evaluates even when the
    # profile is off and would break `docker compose up` for everybody who does not use it)
    entrypoint: ["/bin/sh", "-c", "test -n \"$$GF_SECURITY_ADMIN_PASSWORD\" || { echo 'set GRAFANA_ADMIN_PASSWORD in .env'; exit 1; }; exec /run.sh"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3300:3000"   # 3000 is often taken on a developer machine
    depends_on: [prometheus]
    restart: unless-stopped

# Named volume, not a bind mount: the container runs as uid 10001 (not root), and a bind mount takes
# its permissions from the host folder (root-owned files on Docker Desktop, OneDrive in between).
# Docker creates the volume with the owner of /app/data in the image, which is that user.
volumes:
  data:
  prometheus_data:
  grafana_data:
